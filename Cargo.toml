[package]
name = "clearlag"
version = "0.1.3"
edition = "2024"
description = "Clears ground entities every N minutes or via /clearlag"
authors = ["YourName"]

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { version = "0.2.0", git = "https://github.com/Pumpkin-MC/Pumpkin", package = "pumpkin-plugin-api", tag = "0.2.1+26.3-26.51" }
tracing = "0.1"

serde = { version = "1", features = ["derive"] }
toml = "0.8"
